<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Energi Reaksi Kimia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="energy-reaction-calculator">
    <h3>Kalkulator Energi Reaksi Kimia</h3>
    <form id="energyReactionForm">
      <label for="reactants">Masukkan Enthalpy Pembentukan Reaktan (kJ/mol):</label>
      <input type="text" id="reactants" placeholder="Contoh: 200" required>

      <label for="products">Masukkan Enthalpy Pembentukan Produk (kJ/mol):</label>
      <input type="text" id="products" placeholder="Contoh: -100" required>

      <button type="button" onclick="calculateEnergy()">Hitung Energi Reaksi</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
